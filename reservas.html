<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Brasa Prime</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">BRASA PRIME</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
        <li class="nav-item"><a class="nav-link" href="delivery.html">Delivery</a></li>
        <li class="nav-item"><a class="nav-link active" href="reservas.html">Reservas</a></li>
      </ul>
    </div>
  </div>
</nav>

<div id="notification-container" class="notification-container"></div>

<section class="reserva-section">
  <div class="container">
    <h2 class="section-title">Faça sua <span>Reserva</span></h2>
    <div class="reserva-card">
      <form id="form-reserva">
        <div class="mb-3">
          <label class="form-label text-secondary" style="font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;">Nome completo</label>
          <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary" style="font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;">Telefone</label>
          <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label text-secondary" style="font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;">Data</label>
            <input type="date" id="data" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label text-secondary" style="font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;">Horário</label>
            <input type="time" id="hora" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn-gold w-100" style="border:none;">Reservar Mesa</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 Brasa Prime — Todos os direitos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/js/reservas.js"></script>
<script type="module" src="assets/js/script.js"></script>
</body>
</html>
